<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cashflow Pivot</title>
<link rel="stylesheet" href="vendor/pivot.min.css">
<link rel="stylesheet" href="vendor/subtotal.min.css">
<style>
  :root { --text: #1f2328; --muted: #656d76; --bg: #ffffff; --border: #d0d7de; --accent: #0969da; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; }
  #status { color: var(--muted); }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px;
           background: #f6f8fa; color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #view-link { color: var(--accent); }
  #output { overflow-x: auto; }
  .pvtUi { font-size: 13px; }
  table.pvtTable td.pvtVal, table.pvtTable td.pvtTotal, table.pvtTable td.pvtGrandTotal,
  table.pvtTable td.pvtRowSubtotal, table.pvtTable td.pvtColSubtotal { font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>Cashflow</h1>
  <span id="status">Loading transactions…</span>
  <a id="view-link" href="./">Link to this view</a>
  <button id="reset" type="button">Reset view</button>
</header>
<div id="output"></div>

<script src="vendor/jquery.min.js"></script>
<script src="vendor/jquery-ui.min.js"></script>
<script src="vendor/pivot.min.js"></script>
<script src="vendor/subtotal.min.js"></script>
<script>
const STORAGE_KEY = "cashflow-pivot-view";
// Filters are kept as exclusions only: pivottable also reports the matching inclusions, but saving those
// would pin today's values and hide any new year or category when the view is reopened.
const SAVED_KEYS = ["rows", "cols", "vals", "aggregatorName", "rendererName", "exclusions", "rowOrder", "colOrder"];
const DEFAULT_ORDER = "key_a_to_z";
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const utils = $.pivotUtilities;
const wholePounds = utils.numberFormat({ prefix: "£", digitsAfterDecimal: 0 });
const pounds = x => (x < 0 ? "-" + wholePounds(-x) : wholePounds(x));  // "-£5", not "£-5"
const tpl = utils.aggregatorTemplates;

const DEFAULT_VIEW = {
  rows: ["Group", "Subcategory"],
  cols: ["Year"],
  vals: ["Amount"],
  aggregatorName: "Sum £",
  rendererName: "Table With Subtotal",
};

function storedView() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return saved && typeof saved === "object" ? saved : {};
  } catch (e) {
    return {};
  }
}

// A view in the URL holds only what differs from the default: one query parameter per key, each
// JSON-encoded so values with commas survive. Any query string makes the URL authoritative, so an
// all-default view links to "?view=default" rather than to a bare URL, which means "as last left".
function urlView() {
  if (!location.search) return null;
  const view = {};
  for (const [key, value] of new URLSearchParams(location.search)) {
    if (!SAVED_KEYS.includes(key)) continue;
    try { view[key] = JSON.parse(value); } catch (e) { /* ignore a malformed parameter */ }
  }
  return view;
}

function isDefault(key, value) {
  if (key in DEFAULT_VIEW) return JSON.stringify(value) === JSON.stringify(DEFAULT_VIEW[key]);
  if (key === "exclusions") return $.isEmptyObject(value);
  return value === DEFAULT_ORDER;  // rowOrder, colOrder
}

function viewQuery(config) {
  const params = new URLSearchParams();
  for (const key of SAVED_KEYS) {
    if (config[key] !== undefined && !isDefault(key, config[key])) params.set(key, JSON.stringify(config[key]));
  }
  return "?" + (params.toString() || "view=default");
}

function onRefresh(config) {
  const view = {};
  for (const key of SAVED_KEYS) view[key] = config[key];
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(view)); } catch (e) { /* storage unavailable */ }
  $("#view-link").attr("href", location.pathname + viewQuery(view));
}

function render(data, view) {
  $("#output").pivotUI(data, Object.assign({
    dataClass: utils.SubtotalPivotData,
    renderers: Object.assign({}, utils.subtotal_renderers, utils.renderers),
    aggregators: Object.assign({
      "Sum £": tpl.sum(pounds),
      "Average £": tpl.average(pounds),
      "Count": tpl.count(),
    }, utils.subtotal_aggregators),
    // Collapse to the taxonomy group; click a group to expand its subcategories.
    rendererOptions: { collapseRowsAt: 0 },
    sorters: { Month: utils.sortAs(MONTHS) },
    hiddenFromDragDrop: ["Amount"],
    unusedAttrsVertical: true,
    onRefresh: onRefresh,
  }, DEFAULT_VIEW, view), true);
}

fetch("transactions.json")
  .then(response => {
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.json();
  })
  .then(data => {
    const unclassified = data.filter(r => r.Group === "Uncategorised").length;
    $("#status").text(`${data.length.toLocaleString()} transactions · ${unclassified.toLocaleString()} unclassified`);
    // A view in the URL wins over the one remembered in this browser.
    render(data, urlView() ?? storedView());
    $("#reset").on("click", () => {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* storage unavailable */ }
      history.replaceState(null, "", location.pathname);
      render(data, {});
    });
  })
  .catch(error => $("#status").text(`Could not load transactions: ${error.message}`));
</script>
</body>
</html>
